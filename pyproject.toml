[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxa"
version = "0.1.0"
description = "VOXA — asistente de voz familiar para Linux. Tu voz, tu hogar, más fácil."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Pipeline de voz (Fase 1/3). Versiones a fijar con los resultados de la Fase 0.
audio = [
    "numpy",
    "sounddevice",
    "vosk",
    "faster-whisper",
    "openwakeword",
    "silero-vad",
    "piper-tts",
]
dev = [
    "numpy",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
voxa = "voxa.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxa = ["nlu/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
