[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxa"
version = "0.7.0"
description = "VOXA — asistente de voz familiar para Linux. Tu voz, tu hogar, más fácil."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Pipeline de voz. Versiones a fijar con los resultados de la Fase 0.
# «Hey Voxa» usa onnxruntime directamente: el paquete openwakeword pide tflite-runtime,
# que no existe para Python 3.12 (Mint 22), y silero-vad arrastra PyTorch (varios GB).
audio = [
    "numpy",
    "sounddevice",
    "vosk",
    "faster-whisper",
    "onnxruntime",
    "piper-tts",
]
# Respaldo con IA ([ai] en config.toml): Claude con el SDK de Anthropic; OpenAI, Azure OpenAI y
# los servicios compatibles con el de OpenAI.
ia = [
    "anthropic>=2.3",
    "openai>=1.60",
]
dev = [
    "numpy",
    "anthropic>=2.3",
    "openai>=1.60",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "tzdata; sys_platform == 'win32'",  # zonas horarias para el calendario (Linux ya las trae)
]

[project.scripts]
voxa = "voxa.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxa = ["nlu/*.yaml", "audio/*.yaml", "audio/*.npz", "telefono.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
