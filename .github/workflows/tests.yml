name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # misma base que Linux Mint 22
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Sintaxis de los scripts
        run: for f in scripts/*.sh scripts/*/*.sh; do bash -n "$f"; done
      - name: Revisión de los scripts (shellcheck)
        run: shellcheck --severity=warning scripts/install.sh scripts/fase0/*.sh
      - name: Instalador en modo simulado
        run: bash scripts/install.sh --simular --sin-apt

  voxa-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas para compilar egui (X11/Wayland/OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - run: cargo test --locked
      - run: cargo build --release --locked
