name: Release

# En cada push a master se arman los paquetes (para saber que un release saldría bien);
# con una etiqueta vX.Y.Z además se publica el release con los paquetes y el instalador.
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  paquete:
    strategy:
      matrix:
        include:
          # 22.04 (glibc 2.35): la pantalla corre en Mint 21 / Ubuntu 22.04 y más nuevos.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas para compilar egui (X11/Wayland/OpenGL)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
          key: ${{ matrix.arch }}
      - run: cargo build --release --locked
        working-directory: ui
      - run: bash scripts/empaquetar.sh "${{ matrix.arch }}" ui/target/release/voxa-ui dist
      - name: El paquete trae lo necesario
        run: |
          tar -tzf "dist/voxa-linux-${{ matrix.arch }}.tar.gz" > contenido.txt
          for f in voxa/VERSION voxa/ui/bin/voxa-ui voxa/scripts/install.sh voxa/pyproject.toml voxa/src/voxa/audio/hey_voxa.npz; do
            grep -qx "$f" contenido.txt || { echo "Falta $f"; exit 1; }
          done
      - name: Paquete .deb (doble clic en Mint, Ubuntu y Raspberry Pi OS)
        run: |
          # El pip de Ubuntu 22.04 no entiende [project] de pyproject.toml: uno al día en un entorno aparte.
          python3 -m venv /tmp/rueda-env && /tmp/rueda-env/bin/pip install -q --upgrade pip
          /tmp/rueda-env/bin/pip wheel --no-deps -q -w rueda .
          bash scripts/empaquetar-deb.sh "${{ matrix.arch }}" "dist/voxa-linux-${{ matrix.arch }}.tar.gz" rueda/voxa-*.whl dist
          dpkg-deb -I dist/voxa_*.deb
      - name: El .deb se instala y VOXA arranca su primera vez
        run: |
          sudo VOXA_SIN_ARRANQUE=1 apt-get install -y ./dist/voxa_*.deb
          voxa --version
          test -x /opt/voxa/venv/bin/yt-dlp
          systemctl --global is-enabled voxa.service
          systemctl is-enabled voxa-actualizar.timer voxa-ytdlp.timer
          # Baja los modelos de verdad: así se revisan las huellas fijadas en voxa/prepare.py.
          voxa preparar || true
          test -d ~/.local/share/voxa/models/vosk-model-small-es-0.42
          test -f ~/.local/share/voxa/models/piper/es_MX-claude-high.onnx
          test -f ~/.local/share/voxa/models/wakeword/embedding_model.onnx
          voxa revisar || true
          sudo apt-get remove -y voxa
          test ! -e /opt/voxa/venv
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paquete
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          python_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/voxa/__init__.py)"
          ui_version="$(sed -n 's/^version = "\(.*\)"/\1/p' ui/Cargo.toml | head -1)"
          echo "pyproject $version · __init__ $python_version · ui $ui_version · etiqueta ${GITHUB_REF_NAME}"
          [ "v$version" = "${GITHUB_REF_NAME}" ] && [ "$version" = "$python_version" ] && [ "$version" = "$ui_version" ]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: paquete-*
          merge-multiple: true
          path: dist
      - name: Instalador y huellas
        run: |
          cp scripts/instalar-voxa.sh dist/
          cd dist && sha256sum voxa-linux-*.tar.gz voxa_*.deb instalar-voxa.sh > SHA256SUMS && cat SHA256SUMS
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<EOF
          ## Instalar

          **Lo más fácil:** baja el paquete de tu PC y ábrelo con doble clic (Linux Mint, Ubuntu o Raspberry Pi OS de 64 bits):
          \`voxa_${VERSION}_amd64.deb\` (PC normal) o \`voxa_${VERSION}_arm64.deb\` (Raspberry Pi). Al terminar,
          cierra la sesión y vuelve a entrar: la pantalla muestra un código para configurarla desde el celular.
          Se actualiza sola de madrugada.

          Si sale «Failed to download package files» (errores 404), la lista de paquetes de la PC está vieja:
          abre el Gestor de actualizaciones, dale «Actualizar» (o \`sudo apt update\`) y vuelve a abrir el \`.deb\`.

          **Con la terminal** (u otras distribuciones):

          \`\`\`bash
          curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/instalar-voxa.sh
          bash instalar-voxa.sh
          \`\`\`

          Si ya está instalada: \`voxa actualizar\`. Después, \`voxa revisar\` dice qué falta configurar.

          Los paquetes traen la pantalla ya compilada; \`SHA256SUMS\` tiene sus huellas (el instalador las revisa).
          EOF
          # Las novedades de la versión, si están escritas, van primero.
          if [ -f "docs/novedades/${VERSION}.md" ]; then
            cat "docs/novedades/${VERSION}.md" notas.md > notas-completas.md && mv notas-completas.md notas.md
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --title "VOXA ${VERSION}" --notes-file notas.md --generate-notes

  imagen-pi:
    # La imagen de Raspberry Pi va aparte (tarda): se agrega al release cuando ya está publicado.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publicar
    uses: ./.github/workflows/imagen-pi.yml
    with:
      etiqueta: ${{ github.ref_name }}
