[package]
name = "voxa-ui"
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "http", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
