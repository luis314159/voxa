# Cómo debe pronunciar VOXA ciertas palabras. Sobre todo nombres en inglés,
# que la voz en español lee letra por letra.
#
#   Palabra o frase: como se dice
#
# - Se escribe «a la española», con acento donde va el golpe de voz: «de bítels».
# - Para un caso difícil se pueden dar fonemas IPA entre [[ ]]: «Gabriel: "[[ɡaβɾjˈel]]"».
# - No importan mayúsculas ni minúsculas.
# - Para agregar los tuyos sin tocar este archivo: ~/.config/voxa/pronunciacion.yaml
#   (mismo formato; lo tuyo tiene prioridad).
#
# Para revisar: voxa decir --fonemas "The Beatles"

