# Gramática de intenciones de VOXA.
#
# Los patrones se comparan con el texto ya normalizado: minúsculas, sin acentos
# ni signos y sin «Hey Voxa». Sintaxis:
#   (a|b)       alternativas
#   [x]         opcional (puede contener alternativas y slots)
#   {slot}      texto libre: query, name, device
#   {duration}  duración («diez minutos», «hora y media»)
#   {number}    número («treinta», «80»)
#   {time}      hora del día («ocho y media de la noche», «7 30 p m», «mediodía»)
#
# El ORDEN IMPORTA: gana la primera intención que coincide. Las más específicas
# van arriba y music.play («pon …») va casi al final.
# Un patrón puede ser un texto o {pattern: ..., set: {slot: valor}} para fijar slots.
# default_unit: unidad de un número sin unidad en {duration} (minutos por defecto).

- intent: timer.stop_alarm
  patterns:
    - "(apaga|para|quita|deten|silencia|cancela) [la|las] (alarma|alarmas|timbre)"
    - "(apagala|apagalo)"

- intent: timer.cancel_all
  patterns:
    - "(cancela|quita|borra|elimina) [a] (todos|todas) [los|las] (temporizadores|timers|alarmas)"

# Recordatorios y alarmas a una hora fija. Los de «mañana» van primero: si no, «mañana»
# quedaría dentro del nombre («sacar la basura mañana»).
- intent: timer.remind
  patterns:
    # Para otra persona de la familia: «recuérdale a Ana que tome la medicina a las 8».
    - "(recuerdale|recuerdales|avisale|avisales) a {person} (que|de) {name} (a la|a las) {time}"
    - "(recuerdale|recuerdales|avisale|avisales) a {person} (a la|a las) {time} (que|de) {name}"
    - pattern: "(recuerdale|recuerdales|avisale|avisales) a {person} manana (a la|a las) {time} (que|de) {name}"
      set: {day: manana}
    # Con días: «de lunes a viernes», «los martes», «todos los días», «el viernes».
    - "(despiertame|levantame) {days} (a la|a las|a|al) {time}"
    - "(pon|ponme|programa|crea|activa) [una|un] (alarma|despertador) [para] {days} (a la|a las|a|al) {time} [(para|de|que) {name}]"
    - "(pon|ponme|programa|crea|activa) [una|un] (alarma|despertador) (a la|a las|a|al|para la|para las) {time} {days} [(para|de|que) {name}]"
    - "(recuerdame|acuerdame|avisame) {days} (a la|a las) {time} [(que|de|para)] {name}"
    - "(recuerdame|acuerdame|avisame) {days} [que] {name} (a la|a las) {time}"
    - "(recuerdame|acuerdame|avisame) [que] {name} {days} (a la|a las) {time}"
    - "(recuerdame|acuerdame|avisame) [que] {name} (a la|a las) {time} {days}"
    - pattern: "(despiertame|levantame) manana (a la|a las|a|al) {time}"
      set: {day: manana}
    - "(despiertame|levantame) (a la|a las|a|al) {time}"
    - pattern: "(pon|ponme|programa|crea|activa) [una|un] (alarma|despertador) (para manana|manana) (a la|a las|a|al) {time} [(para|de|que) {name}]"
      set: {day: manana}
    - "(pon|ponme|programa|crea|activa) [una|un] (alarma|despertador) (a la|a las|a|al|para la|para las|para el) {time} [(para|de|que) {name}]"
    - pattern: "(recuerdame|acuerdame|avisame) manana (a la|a las) {time} [(que|de|para)] {name}"
      set: {day: manana}
    - pattern: "(recuerdame|acuerdame|avisame) [que] {name} manana (a la|a las) {time}"
      set: {day: manana}
    - "(recuerdame|acuerdame|avisame) (a la|a las) {time} [(que|de|para)] {name}"
    - "(recuerdame|acuerdame|avisame) [que] {name} (a la|a las) {time}"
    - "(pon|ponme|crea|agrega|programa) [un] recordatorio (a la|a las|para la|para las) {time} [(para|de|que)] {name}"
    - "(pon|ponme|crea|agrega|programa) [un] recordatorio (para|de|que) {name} (a la|a las) {time}"

# Pendientes de la casa y de cada persona (antes que la lista del súper: «agrega… a mis pendientes»).
- intent: tasks.add
  patterns:
    - pattern: "(agrega|anota|apunta|pon|anade) {query} (a|en) (mis|mi lista de) (pendientes|tareas)"
      set: {whose: mine}
    - pattern: "(agrega|anota|apunta|pon|anade) (a|en) mis (pendientes|tareas) [que] {query}"
      set: {whose: mine}
    - "(agrega|anota|apunta|pon|anade) {query} (a|en) (los pendientes|las tareas) de {person}"
    - "(agrega|anota|apunta|pon|anade) {query} (a|en) (los pendientes|las tareas|la lista de pendientes) [de la casa]"

- intent: tasks.list
  patterns:
    - pattern: "(que|cuales) (pendientes|tareas) tengo [hoy]"
      set: {whose: mine}
    - pattern: "(cuales son|dime|leeme|lee) mis (pendientes|tareas)"
      set: {whose: mine}
    - pattern: "tengo (pendientes|algo pendiente)"
      set: {whose: mine}
    - "(que|cuales) (pendientes|tareas) tiene {person}"
    - "(que|cuales) (pendientes|tareas) (hay|tenemos|quedan)"

- intent: tasks.done
  patterns:
    - pattern: "ya (hice|termine|acabe|quedo|quedaron) {query}"
      set: {whose: mine}
    - pattern: "(tacha|quita|borra) {query} de (mis|los) (pendientes|tareas)"
      set: {whose: mine}
    - "(tacha|quita|borra) {query} de los (pendientes|tareas) de {person}"

# Lista del súper. Va antes que todo lo que empieza con «pon» o «quita».
# Antes que la lista del súper: «agrega los ingredientes a la lista» es de la receta.
- intent: recipe.to_list
  patterns:
    - "(agrega|agregale|apunta|anota|pon|mete|manda) los ingredientes (a|en) (la lista|mi lista|la lista del super)"
    - "(agrega|apunta|anota|pon|mete) (la receta|lo de la receta|los ingredientes de la receta) (a|en) (la lista|la lista del super)"

- intent: shopping.clear
  patterns:
    - "(borra|limpia|vacia|elimina) [toda] (la lista|mi lista|la lista del super|la lista de compras|la lista de la compra|la lista del mandado)"
    - "ya (compre|compramos) todo"

- intent: shopping.list
  patterns:
    - "(que hay en|que tiene|leeme|lee|dime|que dice) (la lista|mi lista|la lista del super|la lista de compras|la lista de la compra|la lista del mandado)"
    - "que (hay que|tengo que|tenemos que|falta|nos falta) comprar"

- intent: shopping.remove
  patterns:
    - "(quita|quitale|borra|elimina|tacha|saca) {query} de (la lista|mi lista|la lista del super|la lista de compras|la lista de la compra|la lista del mandado)"
    - "ya (compre|compramos) [el|la|los|las] {query}"

- intent: shopping.add
  patterns:
    - "(agrega|agregale|anade|apunta|anota|pon|ponle|mete) {query} (a|en) (la lista|mi lista|la lista del super|la lista de compras|la lista de la compra|la lista del mandado)"
    - "(hay que comprar|necesitamos comprar|tenemos que comprar|necesitamos|compra) {query}"
    - "(se acabo|se acabaron|se termino|se terminaron|ya no hay|ya no queda|ya no quedan|no hay) [el|la|los|las|mas] {query}"

- intent: timer.set
  patterns:
    - "(pon|ponme|crea|programa|inicia|activa|empieza) [un|una|el|la] (temporizador|timer|cronometro|alarma|cuenta regresiva) (de|por|en|a) {duration} [(para|de|del|pa) {name}]"
    - "(pon|ponme|crea|programa) [un|una] (temporizador|timer|cronometro|alarma) (para|de|del|pa) {name} (de|por|en|a) {duration}"
    - "(temporizador|timer|cronometro|alarma) (de|por|en|a) {duration} [(para|de|del|pa) {name}]"
    - "(avisame|recuerdame|despiertame) en {duration} [(para|de|que) {name}]"
    - "(pon|ponme|cuenta) {duration} [(para|de|del|pa) {name}]"

# Ajustar un temporizador, o posponer la alarma que suena («5 minutos más»).
- intent: timer.adjust
  patterns:
    - pattern: "(agregale|agrega|anadele|anade|sumale|suma|ponle|dale|aumentale) [otros] {duration} [mas] [(al|a la|a los|a las|a|del|de la|para el|para la) {name}]"
      set: {sign: 1}
    - pattern: "(quitale|quita|restale|resta|bajale) {duration} [(al|a la|a los|a las|a|del|de la) {name}]"
      set: {sign: -1}
    - pattern: "[(dame|dale|otros|unos)] {duration} mas"
      set: {sign: 1}
    - pattern: "(pospon|posponla|posponlo|aplaza|atrasa) [(la alarma|el temporizador|el despertador)] [(por|unos)] {duration}"
      set: {sign: 1}

- intent: timer.pause
  patterns:
    - "(pausa|pon en pausa|congela) [el|la|mi] (temporizador|timer|cronometro|cuenta regresiva) [(del|de la|de los|de|para) {name}]"

- intent: timer.resume
  patterns:
    - "(reanuda|continua|sigue con|arranca|quita la pausa del|quitale la pausa al) [el|la|mi] (temporizador|timer|cronometro|cuenta regresiva) [(del|de la|de los|de|para) {name}]"

# La salida de la mañana (antes que «¿cuánto falta para el arroz?»).
- intent: routine.departure
  patterns:
    - "(cuanto falta|cuanto tiempo falta|cuantos minutos faltan) (para salir|para irnos|para la escuela|para irnos a la escuela)"
    - "(a que hora|cuando) (salimos|nos vamos|hay que salir)"

- intent: timer.query
  patterns:
    - "cuanto [tiempo] (falta|queda|le falta|le queda|les falta|les queda) [(al|a la|a los|a las|a|del|de la|de los|de las|de|para|el|la|los|las) {name}]"
    - "(como va|como van) [el|la|los|las|mi|mis] (temporizador|temporizadores|timer|timers|alarma|alarmas) [(del|de la|de|para) {name}]"
    - "(que|cuales|cuantos) (temporizadores|timers|alarmas|recordatorios) (hay|tengo|tienes|llevas)"

- intent: timer.cancel
  patterns:
    - "(cancela|quita|borra|elimina|deten|para|apaga) [el|la|mi] (temporizador|timer|cronometro|alarma|recordatorio|despertador) [(del|de la|de|para) {name}]"
    - "(cancela|quita|borra|elimina) (el|la) (del|de la|de los|de las|de|para) {name}"

# Modo niños: se enciende por voz (para todos); apagarlo es desde el celular.
- intent: kids.off
  patterns:
    - "(quita|apaga|desactiva|cancela|termina|sal del) [el] modo (ninos|nino|infantil)"

- intent: kids.on
  patterns:
    - "(pon|activa|enciende|prende|ponte en|entra en|entra al) [el] modo (ninos|nino|infantil)"
    - "modo (ninos|infantil)"
    - "[ya] (vienen|estan|hay|van a venir|llegaron) (ninos|los ninos|mis sobrinos|los sobrinos|los nietos|mis nietos)"

- intent: system.mute_mic
  patterns:
    - "(deja de escuchar|no escuches|apaga el microfono|desactiva el microfono|silencia el microfono|modo privado|apagate)"

- intent: media.pause
  patterns:
    - "(pausa|pausala|pausalo|pon pausa|para|parale|basta|detente|deten|stop|callate|calla)"
    - "(pausa|para|deten|quita|apaga) [la|el|esta|este] (musica|cancion|rola|video|spotify)"

- intent: media.resume
  patterns:
    - "(sigue|continua|reanuda|play|dale|dale play|quita la pausa|resume|reproduce)"
    - "(sigue|continua|reanuda|pon|ponme|regresa) [con] [la|el|algo de] (musica|cancion|video)"

- intent: media.seek_forward
  default_unit: 1
  patterns:
    - "(adelanta|adelantale|adelantalo|adelante|avanza|avanzale|avanzalo|salta) {duration} [(adelante|mas)]"

- intent: media.seek_back
  default_unit: 1
  patterns:
    - "(atrasa|atrasale|atrasalo|regresa|regresale|regresalo|retrocede|regresate) {duration} [atras]"

- intent: media.next
  patterns:
    - "(siguiente|la siguiente|otra|otra cancion|pasala|cambiala|salta|saltala|saltatela|skip|next|adelante)"
    - "(pon|ponme|pasa|cambia|salta|vete) [a] [la|el] (siguiente|proxima|otra) [cancion|rola|tema]"
    - "(cambia|pasa|salta|quita) [de] [la|esta|el|este] (cancion|rola|tema)"

- intent: media.previous
  patterns:
    - "(anterior|la anterior|atras|regresa|back)"
    - "(pon|ponme|regresa|vuelve) [a] [la|el] (anterior|cancion anterior|rola anterior|de antes)"
    - "(pon|ponme|regresa) [a] [la|el] (cancion|rola|tema) (anterior|de antes|pasada)"

- intent: media.now_playing
  patterns:
    - "(que|cual) (cancion|rola|tema|musica) (es|es esta|es esa|esta sonando|suena|esta|estamos escuchando)"
    - "(que|cual) (canciones|rolas|temas) (esta|esa)"
    - "(que|quien) (esta sonando|suena|canta|canta esto|canta esta|es esto|toca)"
    - "como se llama [esta|esa|la] (cancion|rola|tema)"
    - "quien (canta|es|toca) [esta|esa|la] (cancion|rola|tema)"

- intent: music.like
  patterns:
    - "(me gusta|me encanta) [mucho] [esta|esa] [cancion|rola]"
    - "(guarda|agrega|anade|dale like a) [esta|esa|la] (cancion|rola) [(a|en) [mis] (favoritos|me gusta|biblioteca)]"
    - "(dale like|like|guardala|agregala)"

- intent: music.shuffle
  patterns:
    - "(aleatorio|modo aleatorio|revuelve|revuelvelas|shuffle|mezcla|mezclalas)"
    - "(pon|activa) [el] (modo aleatorio|aleatorio|shuffle)"

- intent: volume.set
  patterns:
    - "[pon|sube|baja|cambia|deja] [el] (volumen|sonido) [a|al|en|de] {number}"
    - "(volumen|sonido) {number}"

- intent: volume.mute
  patterns:
    - "(silencia|mutea|mute) [el|la] [volumen|sonido|musica|bocina]"
    - "(quita|apaga) el (sonido|volumen)"
    - "silencio"

- intent: volume.unmute
  patterns:
    - "(quita|desactiva) el (silencio|mute)"
    - "(activa|regresa|devuelve) el sonido"

- intent: volume.up
  patterns:
    - "(sube|subele|subelo|subela|aumenta|alza) [un poco|un poquito|poquito|mucho|bastante|mas] [el|la|al|a la|a el] [volumen|musica|sonido|cancion] [un poco|un poquito|poquito|mucho|bastante|mas]"
    - "(mas|mas fuerte|mas alto|mas volumen|mas recio|no se oye|no oigo|no escucho|no se escucha)"

- intent: volume.down
  patterns:
    - "(baja|bajale|bajalo|bajala|disminuye|reduce) [un poco|un poquito|poquito|mucho|bastante|mas] [el|la|al|a la|a el] [volumen|musica|sonido|cancion] [un poco|un poquito|poquito|mucho|bastante|mas]"
    - "(mas bajo|mas bajito|menos volumen|menos fuerte|esta muy fuerte|muy fuerte|bajito|mas quedito)"

# «Pon música para cocinar» es un ambiente, no un dispositivo (va antes que music.transfer).
- intent: music.play
  patterns:
    - pattern: "(pon|ponme|reproduce|toca|tocame|quiero escuchar|quiero oir|escuchemos) [unas|una|un poco de|algo de] (musica|algo|canciones|rolas) (para|pa) {query}"
      set: {kind: mood}

- intent: music.playlists
  patterns:
    - "(que|cuales) (playlists|listas de reproduccion) tengo"
    - "(cuales son|dime|lee|leeme) (mis|las) (playlists|listas de reproduccion)"
    - "(que|cuales) playlists hay [en mi cuenta|en spotify]"

- intent: music.transfer
  patterns:
    - "(ponla|ponlo|pasala|pasalo|mandala|mandalo|cambiala|cambialo|muevela|muevelo) (en|a|al|para) [la|el] {device}"
    - "(pasa|manda|cambia|mueve|transfiere|pon) [la|el] (musica|cancion|spotify) (en|a|al|para) [la|el] {device}"

# Conversiones de cocina («¿cuántos gramos es una taza de harina?»).
- intent: kitchen.temperature
  patterns:
    - pattern: "{number} [grados] (fahrenheit|farenheit|farenhait) (en|a) [grados] (celsius|centigrados|centigrado)"
      set: {from: f}
    - pattern: "(cuantos|a cuantos) grados (celsius|centigrados) (son|es|equivalen) {number} [grados] (fahrenheit|farenheit|farenhait)"
      set: {from: f}
    - pattern: "{number} [grados] [(celsius|centigrados)] (en|a) [grados] (fahrenheit|farenheit|farenhait)"
      set: {from: c}
    - pattern: "(cuantos|a cuantos) grados (fahrenheit|farenheit|farenhait) (son|es|equivalen) {number} [grados] [(celsius|centigrados)]"
      set: {from: c}

- intent: kitchen.convert
  patterns:
    - pattern: "(cuantos|cuantas) gramos (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: gramos}
    - pattern: "{query} (en|a) gramos"
      set: {unit: gramos}
    - pattern: "(cuantos|cuantas) (kilos|kilogramos) (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: kilos}
    - pattern: "(cuantas|cuantos) tazas (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: tazas}
    - pattern: "{query} (en|a) tazas"
      set: {unit: tazas}
    - pattern: "(cuantas|cuantos) cucharadas (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: cucharadas}
    - pattern: "{query} (en|a) cucharadas"
      set: {unit: cucharadas}
    - pattern: "(cuantas|cuantos) cucharaditas (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: cucharaditas}
    - pattern: "(cuantos|cuantas) mililitros (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: mililitros}
    - pattern: "{query} (en|a) mililitros"
      set: {unit: mililitros}
    - pattern: "(cuantos|cuantas) litros (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: litros}
    - pattern: "(cuantas|cuantos) onzas (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: onzas}
    - pattern: "{query} (en|a) onzas"
      set: {unit: onzas}
    - pattern: "(cuantas|cuantos) libras (es|son|hay en|tiene|tienen|lleva|llevan|equivale a|equivalen a|caben en|cabe en|pesa|pesan) {query}"
      set: {unit: libras}

# Recetas paso a paso (con IA; sin IA, «receta de…» pone un video de la receta).
- intent: recipe.timer
  patterns:
    - "(pon|ponme|ponle|inicia|empieza|arranca|activa|cuenta) [el|un|ese] (tiempo|temporizador|timer|cronometro) [(del|de este|de ese) paso|de la receta]"
    - "(cuenta|toma|tomame) el tiempo"

- intent: recipe.next
  patterns:
    - "[ya|listo|ok|bueno] (siguiente|proximo|el siguiente|el proximo) paso"
    - "[ya|listo|ok|bueno] (que sigue|y luego|y despues|que mas sigue|que hago despues|que hago ahora|ya quedo que sigue)"
    - "(empezamos|empieza la receta|empecemos|comenzamos|comencemos|vamos con el primer paso|el primer paso)"

- intent: recipe.previous
  patterns:
    - "(paso anterior|el paso anterior|regresa un paso|vuelve un paso|regresa al paso anterior|vuelve al paso anterior)"

- intent: recipe.repeat
  patterns:
    - "(repite|repiteme|repitemelo|dime otra vez|lee otra vez|cual era|como era) [el] paso"
    - "en que paso (voy|vamos|estoy|estamos)"
    - "que paso (es|era)"

- intent: recipe.goto
  patterns:
    - "(ve|ver|vete|pasa|salta|regresa|regresate|vuelve|brinca) al paso {number}"
    - "[el] paso [numero] {number}"

- intent: recipe.ingredients
  patterns:
    - "(que|cuales) [son los] ingredientes (lleva|llevan|necesito|son|tiene|ocupo|ocupamos|necesitamos)"
    - "(dime|dame|lee|leeme|repite|repiteme) los ingredientes"
    - "(los ingredientes|que ingredientes)"

- intent: recipe.close
  patterns:
    - "(termina|cierra|quita|cancela|acaba|termine) [la|esta] receta"
    - "(ya termine|terminamos|ya terminamos) [la receta|de cocinar]"

- intent: recipe.start
  patterns:
    - "(dame|dime|pasame|quiero|busca|buscame|necesito|ensename|lee|leeme) [la|una|el] receta (de|del|para) {query}"
    - "(receta de|receta del|receta para) {query}"
    - "(como se hace|como se hacen|como hago|como hacer|como preparo|como preparar|como se prepara|como se preparan|como cocino|como cocinar) {query}"
    - "(quiero|vamos a|voy a|ayudame a|ensename a) (hacer|preparar|cocinar) {query}"

# La pantalla: «modo foto» (solo la imagen de fondo) y de regreso.
- intent: display.phone
  patterns:
    - "(conecta|vincula|agrega|enlaza|configura) [mi|el|un] (celular|telefono|movil)"
    - "(muestra|muestrame|ensename|pon) el codigo [(del|para el) (celular|telefono)]"
    - "(como|quiero) (uso|usarte|usar voxa|controlarte) (desde|en) [mi|el] (celular|telefono)"
    - "(configura|configurar|configuremos) [a] voxa"
    - "(abre|muestra|muestrame) [los] ajustes"
    - "(quiero) (configurarte|cambiar los ajustes)"

- intent: display.phone_close
  patterns:
    - "(cierra|quita|esconde) el codigo"

- intent: display.photo
  patterns:
    - "(modo foto|solo la foto|solo el fondo|solo la imagen|solo el paisaje|pantalla limpia)"
    - "(muestra|muestrame|pon|ponme|deja|ensename|quiero ver) [solo|nada mas] (la foto|el fondo|la imagen|el paisaje|la foto de fondo|la imagen de fondo) [nada mas|sola|solo]"
    - "(quita|esconde|oculta|apaga) (la informacion|los letreros|lo de la pantalla) [de la pantalla]"

- intent: display.info
  patterns:
    - "(muestra|muestrame|regresa|pon|ponme|ensename|vuelve a mostrar) [toda] (la informacion|la pantalla normal)"
    - "(muestra|muestrame|ensename|vuelve a mostrar) todo"
    - "(quita|sal del|termina|apaga) [el] modo foto"
    - "(modo normal|pantalla normal)"

- intent: video.close
  patterns:
    - "(cierra|quita|apaga|deten) [el] (video|youtube)"

- intent: video.play
  patterns:
    - "(pon|ponme|busca|buscame|reproduce|quiero ver|muestrame|ensename) [un|el|unos|los] (video|videos) (de|del|sobre|para|con|que) {query}"
    - "(busca|buscame|pon|ponme) en youtube {query}"

- intent: clock.time
  patterns:
    - "(que hora es|que horas son|dime la hora|me dices la hora|me das la hora|la hora|hora|que hora tienes)"

- intent: clock.date
  patterns:
    - "(que dia es hoy|que dia es|a que estamos|que fecha es hoy|que fecha es|cual es la fecha|a cuantos estamos|la fecha|fecha)"

- intent: weather.rain
  patterns:
    - "(va a llover|llovera|lloverá) [hoy]"
    - "(va a haber|habra|hay) (lluvia|tormenta) [hoy]"
    - "necesito (paraguas|sombrilla)"

- intent: weather.current
  patterns:
    - "(como esta|como va|que tal|como sigue) el (clima|tiempo)"
    - "(que|cual es la) (clima|temperatura) (hace|hay|tenemos)"
    - "(cuantos grados hace|cuantos grados hay|que temperatura hace|hace frio|hace calor|el clima|clima)"

# El calendario de la familia (de solo lectura).
- intent: calendar.tomorrow
  patterns:
    - "(que tiene|que hay para|que le toca a) {person} [para] manana"
    - "(que tengo|que hay|tengo algo|que tenemos|tenemos algo) [para] manana"
    - "(que hay en|que dice|que tiene) [mi|el|la|nuestro|nuestra] (calendario|agenda) [de|para] manana"
    - "[cual es] [mi|la] agenda [de|para] manana"

- intent: calendar.today
  patterns:
    - "(que tiene|que hay para|que le toca a) {person} [para] hoy"
    - "que hay en el calendario de {person} [para] hoy"
    - "(que tengo|que hay|tengo algo|que tenemos|tenemos algo) [para] hoy"
    - "(que hay en|que dice|que tiene) [mi|el|la|nuestro|nuestra] (calendario|agenda) [de hoy|para hoy|hoy]"
    - "[cual es] [mi|la] agenda [de|para] hoy"
    - "(mi|la) agenda"

- intent: calendar.next
  patterns:
    - "(cual es|que es) [mi|la|el] (siguiente|proxima|proximo) (cita|evento|compromiso|pendiente)"
    - "que sigue en [mi|el|la] (calendario|agenda)"
    - "cuando es [mi|la] (siguiente|proxima) cita"

- intent: routine.good_morning
  patterns:
    - "(buenos dias|buen dia|buenas tardes|buenos dias a todos|buenos dias familia)"

- intent: routine.good_night
  patterns:
    - "(buenas noches|ya me voy a dormir|me voy a dormir|hasta manana)"

- intent: system.help
  patterns:
    - "(que puedes hacer|que sabes hacer|ayuda|ayudame|como te uso|que haces|que comandos hay|que te puedo pedir|que te puedo decir|que sabes)"

- intent: update.check
  patterns:
    - "(hay|tienes|buscas|busca) [alguna|una|unas] (actualizacion|actualizaciones|version nueva|nueva version)"
    - "(que version (eres|tienes|es)|estas actualizada|estas al dia)"

- intent: update.install
  patterns:
    - "(actualizate|actualiza voxa|actualizar voxa|instala la actualizacion|instala la version nueva|ponte al dia)"

- intent: system.status
  patterns:
    - "(estas ahi|me escuchas|me oyes|estas bien|como estas|funcionas|hola|hola voxa)"

- intent: system.repeat
  patterns:
    - "(repite|repitelo|que dijiste|otra vez|como dijiste|no te entendi|perdon|mande|que)"

- intent: system.cancel
  patterns:
    - "(nada|cancela|cancelalo|olvidalo|no importa|dejalo|ninguno|me equivoque|nada nada)"

- intent: system.ack
  patterns:
    - "(ya|ok|okay|listo|gracias|muchas gracias|perfecto|ya esta|ya estuvo|bien|esta bien)"

# Avisos entre cuartos (VOXA en varios cuartos).
- intent: house.announce
  patterns:
    - "(avisa|anuncia|diles|dile|avisales) a todos [que] {query}"
    - "(avisa|anuncia|di) en toda la casa [que] {query}"
    - "(avisa|anuncia|di) en (la|el) {device} que {query}"
    - "(dile|diles|avisa|avisale|avisales|anuncia) (a la|al|a el|a los|a las) {device} que {query}"
    - pattern: "(llama|llamale|llamales) a todos a {query}"
      set: {call: "si"}

# «Aprende mi voz»: VOXA guía la grabación para el verificador de «Hey Voxa».
- intent: voice.enroll
  patterns:
    - "(aprende|aprendete|graba|grabame) mi voz"
    - "(aprende|aprendete|graba) la voz de {name}"
    - "(aprende|aprendete) a (reconocerme|reconocer mi voz)"
    - "(aprende|aprendete) a reconocer a {name}"
    - "soy {name} (aprende|aprendete|graba) mi voz"

# Una alarma o un temporizador cuya hora no se entendió: se pregunta otra vez en lugar de
# buscar «una alarma la media día» en Spotify. Va justo antes de la música genérica.
- intent: timer.unclear
  patterns:
    - "(pon|ponme|crea|programa|activa|inicia) [un|una|el|la] (temporizador|timer|cronometro|alarma|despertador|recordatorio) {query}"

- intent: music.play
  patterns:
    - pattern: "(pon|ponme|reproduce|toca|tocame|quiero escuchar|quiero oir|escuchemos) (mis|los|las) (me gusta|likes|favoritas|favoritos|canciones favoritas|canciones guardadas|canciones que me gustan)"
      set: {kind: liked, query: me gusta}
    - pattern: "(pon|ponme|reproduce|toca|tocame) [la] musica que me gusta"
      set: {kind: liked, query: me gusta}
    - pattern: "(pon|ponme|reproduce|toca|tocame|quiero escuchar|quiero oir|escuchemos|pongan) (musica|canciones|rolas|algo) (de|del) {query}"
      set: {kind: artist}
    - pattern: "(pon|ponme|reproduce|toca|tocame|quiero escuchar|quiero oir) (la cancion|la rola|el tema|la de|esa de) {query}"
      set: {kind: track}
    - pattern: "(pon|ponme|reproduce|toca|quiero escuchar|quiero oir) (el disco|el album|el lp) {query}"
      set: {kind: album}
    - pattern: "(pon|ponme|reproduce|toca|quiero escuchar|quiero oir) (la playlist|mi playlist|la lista|mi lista|la lista de reproduccion) [de] {query}"
      set: {kind: playlist}
    - "(pon|ponme|reproduce|toca|tocame|quiero escuchar|quiero oir|escuchemos) [a] {query}"
