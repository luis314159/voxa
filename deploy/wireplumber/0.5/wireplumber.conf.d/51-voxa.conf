# VOXA (WirePlumber 0.5+): equivalente a deploy/wireplumber/0.4.

# Bocina Bluetooth solo en A2DP: nunca cambia al modo manos libres al abrir el micrófono.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

# Ni la bocina ni la salida de la PC se suspenden en silencio.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
