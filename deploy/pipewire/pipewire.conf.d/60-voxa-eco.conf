# VOXA: micrófono con cancelación de eco (PipeWire ≥ 0.3.80; Mint 22 trae 1.0).
#
# Le resta al micrófono lo que suena por la bocina (música, videos y la propia voz de VOXA),
# para oír «Hey Voxa» con la música puesta. Toma como referencia lo que sale por la salida
# predeterminada (monitor.mode), así que funciona igual con la bocina Bluetooth.
#
# Lo instala `scripts/install.sh --cancelar-eco`, que además deja «VOXA: micrófono sin eco»
# como micrófono predeterminado. Para quitarlo: borra este archivo y reinicia PipeWire.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      aec.args = {
        # La bocina Bluetooth llega con 150–300 ms de retraso: el filtro largo y el ajuste
        # automático del retraso lo compensan.
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
        # El volumen lo maneja VOXA (fin de frase por energía): sin control automático de ganancia.
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "voxa_eco_captura"
        node.passive = true
      }
      source.props = {
        node.name = "voxa_mic_sin_eco"
        node.description = "VOXA: micrófono sin eco"
      }
    }
  }
]
