# Configuración de VOXA.
# Copia este archivo a ~/.config/voxa/config.toml y cambia lo que necesites.
# Todo lo que no aparezca usa el valor por defecto.

[spotify]
# Client ID de la app creada en https://developer.spotify.com/dashboard (ver docs/fase0_guia.md).
# Se usa OAuth con PKCE: no hace falta el client secret.
client_id = ""
# Nombre del dispositivo Spotify Connect de la cocina (el que se le puso a Spotifast).
device_name = "VOXA Cocina"
# Debe coincidir EXACTAMENTE con la Redirect URI registrada en la app de Spotify.
redirect_uri = "http://127.0.0.1:8765/callback"

[spotifast]
# Comando para la CLI de Spotifast. Con Flatpak sería algo como
# ["flatpak", "run", "rocks.spotifast.Spotifast"] (confirmar en la Fase 0).
command = ["spotifast"]
# Nombre del reproductor en MPRIS (playerctl --list-all).
mpris_player = "spotifast"

[volume]
# Cuánto sube o baja «súbele» / «bájale» (en %). «un poco» usa la mitad, «mucho» el doble.
step = 10

[timers]
# Cada cuánto se repite la alarma mientras nadie la apaga.
alarm_repeat_seconds = 30
# Tras cuántos minutos sonando se apaga sola.
alarm_timeout_minutes = 10

[voice]
# Reconocimiento de voz: "vosk" (rápido), "whisper" (preciso) o "hibrido"
# (Vosk para comandos; Whisper cuando la frase trae nombres de canciones o videos).
stt = "hibrido"
# Carpeta del modelo de Vosk en español (https://alphacephei.com/vosk/models).
vosk_model = "~/.local/share/voxa/models/vosk-model-small-es-0.42"
# Tamaño de faster-whisper: "tiny", "base" o "small" (según el benchmark de la Fase 0).
whisper_model = "base"
# Voz de Piper (.onnx con su .onnx.json al lado):
#   python -m piper.download_voices es_MX-claude-high --download-dir ~/.local/share/voxa/models/piper
piper_voice = "~/.local/share/voxa/models/piper/es_MX-claude-high.onnx"
# Velocidad del habla: < 1 más rápido, > 1 más lento.
speech_rate = 1.0
# Dispositivos de audio (nombre o número; vacío = el predeterminado del sistema).
#   python -m sounddevice   ← lista los dispositivos
input_device = ""
output_device = ""
# Silencio antes de cada sonido para que una bocina Bluetooth dormida no se coma el inicio.
lead_in_ms = 0
# Audio del micrófono que se descarta tras el sonido «escuchando» (su eco por la bocina).
# Con Bluetooth conviene 300–400 por la latencia.
echo_guard_ms = 240
# A qué fracción baja la música mientras VOXA escucha o habla.
duck_level = 0.2
# Silencio que marca el fin de una orden.
end_silence_ms = 720

[wake]
# «Hey Voxa»: activar VOXA con la voz, sin tocar la pantalla.
enabled = true
# Vacío = el modelo que trae VOXA. Aquí iría uno propio (scripts/hey_voxa/).
model = ""
# Modelos base que descarga el instalador.
feature_dir = "~/.local/share/voxa/models/wakeword"
# 0 = el recomendado por el modelo. Más alto si se activa sola; más bajo si no te oye.
#   voxa probar-activacion   ← muestra en vivo qué tanto «cree» oír «Hey Voxa»
threshold = 0.0
# Bloques de 80 ms seguidos sobre el umbral para activarse.
patience = 2
# Verificador familiar (voxa grabar-activacion + voxa entrenar-verificador).
# Vacío = feature_dir/verificador.npz, si existe.
verifier = ""

[display]
# Canal local (solo 127.0.0.1) por el que la pantalla de cocina (voxa-ui) recibe el estado.
enabled = true
port = 8766

[video]
# Videos de YouTube («pon un video de cómo hacer pozole»): yt-dlp busca, mpv reproduce.
enabled = true
ytdlp = "yt-dlp"
mpv = ["mpv"]
# Calidad máxima: 720 va bien en un All-in-One; 480 si la PC tiene 2 GB de RAM.
max_height = 720

[routine]
# «Buenos días»: además de la hora, el clima y los recordatorios del día, pone esta música.
# Ejemplo: morning_music = "mi playlist de la mañana"   (vacío = sin música)
morning_music = ""

[weather]
# Ubicación de la casa para el clima (Open-Meteo). Ejemplo: Ciudad de México.
# latitude = 19.43
# longitude = -99.13
# place = "Ciudad de México"
# (Más fácil: desde el celular, en Ajustes → Clima, se busca la ciudad por nombre.)

[web]
# VOXA desde el celular, en la misma red de la casa: temporizadores, lista del súper, música,
# órdenes escritas y fotos para el fondo. Para entrar hace falta la clave de esta PC: di
# «conecta mi celular» y escanea el código de la pantalla. Apagado por defecto.
enabled = false
port = 8770

[calendar]
# «¿Qué tengo hoy?» y lo de hoy en «buenos días», del calendario de la familia (solo lectura).
# Se configura desde el celular (Ajustes → Calendario) pegando la «dirección secreta en formato
# iCal» del calendario (Google Calendar: Configuración → el calendario → Integrar el calendario).
# La dirección se guarda en ~/.config/voxa/calendario_url (600): quien la tiene puede leerlo.
enabled = false

[telegram]
# La lista del súper desde Telegram, también fuera de casa: se le escribe «leche y huevos» al
# bot y lo agrega; «/lista» la manda con un botón por cosa para ir palomeando en la tienda.
# Crea el bot con @BotFather, corre «voxa telegram-vincular» (pide el token y un código para
# cada chat de la familia) y pon enabled = true. Solo atiende a los chats vinculados.
enabled = false

[update]
# Revisar cada 6 horas si hay una versión nueva de VOXA (se ve en el diagnóstico y se puede
# preguntar «¿hay actualizaciones?»; «actualízate» la instala).
check = true
# Instalarla sola de madrugada (3 a 5 a. m.), cuando no hay temporizadores ni nadie hablando.
automatic = false

[ai]
# Respaldo con IA (opcional, de paga): lo que VOXA no entiende se le pregunta a un modelo de
# lenguaje («¿con qué sustituyo el huevo en un pastel?»). Si la persona pidió algo que VOXA sabe
# hacer dicho de otra forma, la IA lo traduce a una orden de VOXA. Solo se manda el texto de la
# frase (nunca audio) y las preguntas de los últimos 3 minutos.
#   1. voxa ia-clave     ← guarda la llave en ~/.config/voxa/ia_clave (permisos 600)
#   2. enabled = true y reinicia: systemctl --user restart voxa
#   3. voxa ia-probar "¿cuánto se cuece un huevo tibio?"   ← respuesta, tiempo y costo
enabled = false
# "claude" (Anthropic), "openai", "azure" (Azure OpenAI) o "compatible" (cualquier servicio con
# la API de OpenAI: Gemini, Groq, Mistral, DeepSeek, OpenRouter, Ollama en la red de la casa…).
provider = "claude"
# Vacío con Claude = claude-opus-5-5 (4 / 20 USD por millón de tokens de entrada / salida).
# claude-haiku-5-5 cuesta 40 veces menos (0.10 / 0.50) y responde más rápido; suele bastar para
# preguntas de cocina. Con azure va el nombre del *deployment*. Con openai o compatible, el modelo.
model = ""
# azure: https://TU-RECURSO.openai.azure.com          compatible, por ejemplo:
#   Gemini      https://generativelanguage.googleapis.com/v1beta/openai/
#   Groq        https://api.groq.com/openai/v1
#   OpenRouter  https://openrouter.ai/api/v1
#   Ollama      http://IP-DE-LA-PC:11434/v1   (sin llave)
endpoint = ""
# Variable de entorno con la llave, si prefieres eso al archivo (vacío = ANTHROPIC_API_KEY,
# OPENAI_API_KEY o AZURE_OPENAI_API_KEY según el proveedor).
key_env = ""
# Claude: esfuerzo "low" (vacío = low), "medium" o "high"; "ninguno" para modelos que no lo aceptan.
# OpenAI/Azure: se manda como reasoning_effort solo si lo pones ("minimal", "low"…), para modelos que razonan.
effort = ""
# Solo Claude: que pueda buscar en internet (precios, resultados, noticias). 10 USD por mil búsquedas.
web_search = false
# Tope de gasto al mes (USD) y de preguntas al día. 0 = sin tope.
monthly_budget_usd = 5.0
daily_questions = 60
# USD por millón de tokens, para contar el gasto con modelos que VOXA no conoce (todos los de
# OpenAI, Azure y compatibles). Con 0, VOXA usa su tabla de precios de Claude.
price_input = 0.0
price_output = 0.0
timeout_seconds = 15.0
# Lo que la IA debe saber de la casa, en una frase. Ejemplo: "Vivimos en Monterrey; Ana es vegetariana."
context = ""
