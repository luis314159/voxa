<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="300 170 600 600" role="img" aria-labelledby="title">
  <title id="title">VOXA</title>
  <defs>
    <linearGradient id="voxa-gradient" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#11DDF2"/>
      <stop offset="48%" stop-color="#3478FF"/>
      <stop offset="100%" stop-color="#D52BFF"/>
    </linearGradient>
    <linearGradient id="v-gradient" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#25E5F0"/>
      <stop offset="52%" stop-color="#3478FF"/>
      <stop offset="100%" stop-color="#C42CFF"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App icon: same mark as the logo (center 600,470) on a rounded dark tile. -->
  <rect x="300" y="170" width="600" height="600" rx="132" fill="#0B1020"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(600 470) scale(0.86) translate(-600 -470)">
    <path d="M 717.4 249.3 A 250 250 0 1 0 797.0 316.1" stroke="url(#voxa-gradient)" stroke-width="26" filter="url(#soft-glow)"/>
    <path d="M 404 444 V 496 M 436 408 V 532 M 468 444 V 496"
          stroke="url(#voxa-gradient)" stroke-width="20"/>
    <path d="M 732 444 V 496 M 764 408 V 532 M 796 444 V 496"
          stroke="url(#voxa-gradient)" stroke-width="20"/>
    <path d="M 512 372 L 588 540 Q 600 566 612 540 L 688 372"
          stroke="url(#v-gradient)" stroke-width="68"/>
  </g>
</svg>
